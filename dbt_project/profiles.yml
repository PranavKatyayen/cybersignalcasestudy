# Safe to commit: every value is read from an environment variable at run time
cybersignal:
  target: dev
  outputs:
    dev:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('SNOWFLAKE_USER') }}"
      password: "{{ env_var('SNOWFLAKE_PASSWORD') }}"
      role: "{{ env_var('SNOWFLAKE_ROLE', 'ACCOUNTADMIN') }}"
      database: "{{ env_var('SNOWFLAKE_DATABASE', 'CYBERSIGNAL') }}"
      warehouse: "{{ env_var('SNOWFLAKE_WAREHOUSE', 'CYBERSIGNAL_WH') }}"
      schema: staging
      threads: 4
